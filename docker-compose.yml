services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sam-ai:latest
    pull_policy: build
    container_name: sam_ai_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local MongoDB service (run with: docker compose --profile local-db up -d)
  mongo:
    image: mongo:7.0
    container_name: sam_ai_mongo
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=examplepassword
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
